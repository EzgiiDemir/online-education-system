# Nginx site for eCenter. deploy/server-setup.sh installs this as
# /etc/nginx/sites-available/ecenter with __DOMAIN__ replaced.
#
# Only port 80 is defined here on purpose: once DNS points at the server,
#   sudo certbot --nginx -d ecenter.arucad.edu.tr
# adds the 443/TLS block and the http->https redirect to this same file and
# installs automatic renewal. Until then sign-in will not work, because
# SESSION_SECURE_COOKIE=true keeps the session cookie off plain http.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # "current" is a symlink to the active release (see deploy/deploy.sh).
    root /var/www/ecenter/current/public;
    index index.php;
    charset utf-8;

    # Live-class recordings are accepted up to 500 MB
    # (LmsController: recording max:512000). Keep in step with
    # upload_max_filesize / post_max_size in the PHP-FPM pool.
    client_max_body_size 600M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fingerprinted Vite output never changes under the same name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink, so PHP's opcache
        # sees the new release path immediately after a deploy.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # No other PHP file and no dotfile (.env, .git ...) is ever served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
